# Minimal single-binary Loki config for local dev.
# Filesystem storage, no auth, TSDB index.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # allow slightly out-of-order pushes (dev logs arrive in bursts)
  reject_old_samples: false
  retention_period: 168h

ruler:
  alertmanager_url: http://localhost:9093
